[package]
name = "comunicado"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A modern TUI-based email and calendar client"
license = "AGPL-3.0"
repository = "https://github.com/your-username/comunicado"
keywords = ["email", "calendar", "tui", "terminal", "imap"]
categories = ["command-line-utilities", "email"]
default-run = "comunicado"

[dependencies]
# TUI Framework
ratatui = { version = "0.28", features = ["serde"] }
crossterm = "0.27"
tui-textarea = "0.4"
arboard = "=3.3.0"

# Async Runtime - optimized for performance
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "fs", "time", "macros", "sync", "io-util", "process", "signal"] }
futures = "0.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Command Line Interface
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time handling
chrono = { version = "0.4", features = ["serde"] }

# Text processing
regex = "1.10"

# HTML parsing and rendering (industry best practices - 2024/2025)
scraper = "0.19"  # Built on html5ever - browser-grade HTML parsing
html2text = "0.6"  # Industry standard for terminal HTML-to-text conversion
ammonia = "3.3"   # Security-first HTML sanitization using html5ever
pulldown-cmark = "0.9"  # Enhanced markdown support for better text formatting

# Image processing and terminal graphics - optimized
image = { version = "=0.24.9", default-features = false, features = ["png", "gif"] }
gif = "0.13"

# Email and networking
base64 = "0.22"
oauth2 = { version = "4.4", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2.5"
sha2 = "0.10"
rand = "0.8"

# TLS support for IMAP
tokio-rustls = "0.25"
rustls = "0.22"
rustls-webpki = "0.102"
webpki-roots = "0.26"

# Additional dependencies for contacts
async-trait = "0.1"

# Fuzzy matching for command palette
fuzzy-matcher = "0.3"

# vCard/iCalendar parsing with RFC compliance
calcard = "0.1"

# Desktop notifications - optional dependency for feature flag
notify-rust = { version = "4.10", optional = true }
percent-encoding = "2.3"

# File system watching
notify = "6.1"

# SMTP email sending
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport", "builder", "pool"], default-features = false }

# Secure storage
keyring = "2.3"

# GPG encryption and signing (pure Rust implementation)
# Optimized for faster compilation - experimental crypto features removed for performance
sequoia-openpgp = { version = "1.19", default-features = false, features = ["compression", "crypto-rust"] }

# Database and caching - optimized features
sqlx = { version = "0.8.1", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros", "migrate"] }
uuid = { version = "1.6", default-features = false, features = ["v4", "v5", "serde"] }

# System directories
dirs = "5.0"
glob = "0.3"
tempfile = "3.8"
webbrowser = "0.8"
urlencoding = "2.1"

# System monitoring - removed unused sysinfo dependency

# Hostname for Maildir unique IDs
hostname = "0.3"

# D-Bus integration for KDE Connect (optional)
dbus = { version = "0.9", optional = true }
dbus-tokio = { version = "0.7", optional = true }
once_cell = "1.19"

# Maildir support
maildir = "0.6"
walkdir = "2.5"
indicatif = "0.17"
filetime = "0.2"

# Spell checking dependencies removed - implementing custom solution

[dev-dependencies]
# Testing - optimized for faster development builds
tokio-test = "0.4"
tempfile = "3.8"        # Temporary files for testing
# Removed unused dev dependencies: assert_cmd, predicates, serial_test, proptest

[features]
default = ["notifications", "experimental-crypto"]
# Performance-optimized feature flags
notifications = ["notify-rust"]
kde-connect = ["dbus", "dbus-tokio"]
modular-ui = []
# Optional heavy features for reduced compile time
webp-images = ["image/webp"]
jpeg-images = ["image/jpeg"]
experimental-crypto = ["sequoia-openpgp/allow-experimental-crypto", "sequoia-openpgp/allow-variable-time-crypto"]

[[bin]]
name = "comunicado"
path = "src/main.rs"


[profile.release]
strip = true
lto = "fat"              # More aggressive LTO
codegen-units = 1        # Better optimization
panic = "abort"
opt-level = 3            # Maximum optimization
overflow-checks = false  # Disable runtime checks

[profile.release-small]
inherits = "release"
opt-level = "z"          # Optimize for size over speed
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Optimized development profile
[profile.dev]
opt-level = 1            # Basic optimization for faster debug builds
debug = 1                # Reduced debug info
incremental = true       # Enable incremental compilation

# Profile for faster incremental builds during development
[profile.dev-fast]
inherits = "dev"
debug = false            # No debug info for faster builds
opt-level = 0            # No optimization for fastest builds