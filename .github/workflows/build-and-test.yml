name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, 1.70.0]  # MSRV and stable
        exclude:
          # Only test MSRV on Ubuntu to reduce CI time
          - os: macos-latest
            rust: 1.70.0
          - os: windows-latest
            rust: 1.70.0

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libssl-dev \
          libsqlite3-dev \
          pkg-config \
          libdbus-1-dev \
          build-essential

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install openssl sqlite pkg-config

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ matrix.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ matrix.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check code formatting
      if: matrix.os != 'macos-latest'  # Skip on macOS due to module resolution issues
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets -- -W clippy::all -A clippy::uninlined_format_args -A clippy::field_reassign_with_default -A clippy::manual_map

    - name: Build
      run: cargo build

    - name: Run tests
      run: |
        cargo test -- \
          --skip test_imap_connection \
          --skip test_oauth_flow \
          --skip test_caldav_sync \
          --skip test_network_image_loading

    - name: Run integration tests (Ubuntu only)
      if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
      run: |
        # Install additional test dependencies
        sudo apt-get install -y xvfb
        
        # Run tests that require display
        xvfb-run -a cargo test integration_

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: |
        cargo audit \
          --ignore RUSTSEC-2023-0071 \
          --ignore RUSTSEC-2024-0388 \
          --ignore RUSTSEC-2025-0057 \
          --ignore RUSTSEC-2024-0384 \
          --ignore RUSTSEC-2024-0436

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libssl-dev \
          libsqlite3-dev \
          pkg-config \
          libdbus-1-dev \
          build-essential

    - name: Install grcov
      run: cargo install grcov

    - name: Run tests with coverage
      env:
        RUSTFLAGS: '-Cinstrument-coverage'
        LLVM_PROFILE_FILE: 'coverage-%p-%m.profraw'
      run: |
        cargo test -- \
          --skip test_imap_connection \
          --skip test_oauth_flow \
          --skip test_caldav_sync \
          --skip test_network_image_loading || true

    - name: Generate coverage report
      run: |
        grcov . \
          --binary-path ./target/debug/ \
          --source-dir . \
          --output-types html \
          --branch \
          --ignore-not-existing \
          --output-path ./coverage/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./coverage/
        fail_ci_if_error: false

