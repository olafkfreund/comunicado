apiVersion: apps/v1
kind: Deployment
metadata:
  name: comunicado
  namespace: comunicado
  labels:
    app.kubernetes.io/name: comunicado
    app.kubernetes.io/instance: comunicado
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: email-client
    app.kubernetes.io/part-of: comunicado
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1  # Email clients typically run as single instances per user
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: comunicado
      app.kubernetes.io/instance: comunicado
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comunicado
        app.kubernetes.io/instance: comunicado
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/component: email-client
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: comunicado
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: comunicado
        image: ghcr.io/olafkfreund/comunicado:latest
        imagePullPolicy: Always
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
        
        env:
        - name: RUST_LOG
          value: "comunicado=info"
        - name: TERM
          value: "xterm-256color"
        - name: COMUNICADO_CONTAINER
          value: "true"
        - name: COMUNICADO_K8S
          value: "true"
        - name: XDG_CONFIG_HOME
          value: "/home/comunicado/.config"
        - name: XDG_DATA_HOME
          value: "/home/comunicado/.local/share"
        - name: XDG_CACHE_HOME
          value: "/home/comunicado/.cache"
        
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
            ephemeral-storage: "2Gi"
          requests:
            memory: "256Mi"
            cpu: "250m"
            ephemeral-storage: "1Gi"
        
        volumeMounts:
        - name: config-volume
          mountPath: /home/comunicado/.config/comunicado
          readOnly: true
        - name: data-volume
          mountPath: /home/comunicado/.local/share/comunicado
        - name: cache-volume
          mountPath: /home/comunicado/.cache/comunicado
        - name: tmp-volume
          mountPath: /tmp
        
        # TUI applications need these for interactive operation
        stdin: true
        tty: true
        
        # Startup probe - TUI apps may take time to initialize
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "comunicado --health-check"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 6
        
        # Liveness probe
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "comunicado --health-check"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "comunicado --health-check"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      
      volumes:
      - name: config-volume
        configMap:
          name: comunicado-config
          items:
          - key: config.toml
            path: config.toml
          - key: logging.yaml
            path: logging.yaml
      - name: data-volume
        persistentVolumeClaim:
          claimName: comunicado-data-pvc
      - name: cache-volume
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp-volume
        emptyDir:
          sizeLimit: 100Mi
      
      # Restart policy for email clients
      restartPolicy: Always
      
      # Node selection (optional)
      nodeSelector:
        kubernetes.io/os: linux
      
      # Tolerations for specific workloads (optional)
      tolerations:
      - key: "email-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      
      # Affinity rules (optional)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - comunicado
              topologyKey: kubernetes.io/hostname