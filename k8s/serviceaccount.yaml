apiVersion: v1
kind: ServiceAccount
metadata:
  name: comunicado
  namespace: comunicado
  labels:
    app.kubernetes.io/name: comunicado
    app.kubernetes.io/instance: comunicado
    app.kubernetes.io/component: service-account
    app.kubernetes.io/part-of: comunicado
automountServiceAccountToken: false  # Security best practice

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: comunicado
  name: comunicado-role
  labels:
    app.kubernetes.io/name: comunicado
    app.kubernetes.io/instance: comunicado
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: comunicado
rules:
# Allow reading own pod information (for health checks, etc.)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
  resourceNames: []
# Allow reading configmaps and secrets (if needed for dynamic config)
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Allow updating own pod status (for advanced health reporting)
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: comunicado-rolebinding
  namespace: comunicado
  labels:
    app.kubernetes.io/name: comunicado
    app.kubernetes.io/instance: comunicado
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: comunicado
subjects:
- kind: ServiceAccount
  name: comunicado
  namespace: comunicado
roleRef:
  kind: Role
  name: comunicado-role
  apiGroup: rbac.authorization.k8s.io