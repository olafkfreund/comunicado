[package]
name = "comunicado"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A modern TUI-based email and calendar client"
license = "AGPL-3.0"
repository = "https://github.com/your-username/comunicado"
keywords = ["email", "calendar", "tui", "terminal", "imap"]
categories = ["command-line-utilities", "email"]
default-run = "comunicado"

[dependencies]
# TUI Framework - optimized for performance
ratatui = { version = "0.26", default-features = false }  # Remove serde feature if not needed
crossterm = "0.27"
tui-textarea = { version = "0.4", default-features = false }
arboard = { version = "3.4", default-features = false }

# Async Runtime - minimal features
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "io-util", "time", "fs", "process", "signal", "sync", "macros"] }
futures = "0.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration - consolidate TOML parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
toml = "0.8"
# Remove serde_yaml - not used enough to justify the dependency

# Command Line Interface
clap = { version = "4.4", features = ["derive"], default-features = false }

# Logging - optimized
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], default-features = false }

# Date/Time handling
chrono = { version = "0.4", features = ["serde"], default-features = false }

# Text processing
regex = { version = "1.10", default-features = false, features = ["std"] }

# HTML parsing and rendering - consolidated to reduce duplicates
scraper = { version = "0.19", default-features = false }
html2text = { version = "0.6", default-features = false }
ammonia = { version = "3.3", default-features = false }
pulldown-cmark = { version = "0.9", default-features = false }

# Image processing - optimized features
image = { version = "0.24", features = ["jpeg", "png", "gif"], default-features = false }  # Remove webp to reduce size
imageproc = { version = "0.23", default-features = false }
gif = "0.13"

# Email and networking - consolidated TLS
base64 = "0.22"
oauth2 = { version = "4.4", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = { version = "2.5", default-features = false }
sha2 = "0.10"
rand = { version = "0.8", default-features = false, features = ["std"] }

# TLS support - unified version
tokio-rustls = "0.25"
rustls = "0.22"
rustls-webpki = "0.102"
webpki-roots = "0.26"

# Additional dependencies
async-trait = "0.1"

# vCard/iCalendar parsing
calcard = { version = "0.1", default-features = false }

# Desktop notifications - minimal features
notify-rust = { version = "4.10", default-features = false, features = ["dbus"] }
percent-encoding = "2.3"

# File system watching
notify = { version = "6.1", default-features = false }

# SMTP - optimized features
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport", "builder"], default-features = false }

# Secure storage
keyring = { version = "2.3", default-features = false }

# GPG encryption - optimized crypto backend
sequoia-openpgp = { version = "1.19", default-features = false, features = ["compression", "crypto-rust"] }

# Database - minimal features
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono"], default-features = false }
uuid = { version = "1.6", features = ["v4"], default-features = false }

# System utilities
dirs = { version = "5.0", default-features = false }
glob = "0.3"
tempfile = { version = "3.8", default-features = false }
webbrowser = { version = "0.8", default-features = false }
urlencoding = "2.1"

# System monitoring - minimal
sysinfo = { version = "0.30", default-features = false }

# Hostname for Maildir
hostname = { version = "0.3", default-features = false }

# D-Bus integration (optional)
dbus = { version = "0.9", optional = true, default-features = false }
dbus-tokio = { version = "0.7", optional = true }
once_cell = "1.19"

# Maildir support
maildir = { version = "0.6", default-features = false }
walkdir = "2.5"
indicatif = { version = "0.17", default-features = false }
filetime = "0.2"

[dev-dependencies]
tokio-test = "0.4"
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
serial_test = "3.0"
proptest = { version = "1.4", default-features = false }

[features]
default = ["notifications"]
notifications = ["notify-rust"]
kde-connect = ["dbus", "dbus-tokio"]
modular-ui = []
# Add feature flags for optional functionality
webp-images = ["image/webp"]
full-crypto = ["sequoia-openpgp/allow-experimental-crypto", "sequoia-openpgp/allow-variable-time-crypto"]

[[bin]]
name = "comunicado"
path = "src/main.rs"

[profile.release]
strip = true
lto = "fat"              # More aggressive LTO
codegen-units = 1        # Better optimization at cost of compile time
panic = "abort"
opt-level = 3            # Maximum optimization
overflow-checks = false   # Disable overflow checks in release

[profile.release-small]
inherits = "release"
opt-level = "z"          # Optimize for size
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1            # Basic optimization for faster debug builds
debug = 1                # Reduced debug info for faster builds